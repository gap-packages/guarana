      version: ">=2.0"
      url: "https://gap-packages.github.io/nq/"
    - name: "polycyclic"
      version: ">=2.11"
      url: "https://gap-packages.github.io/polycyclic/"
    - name: "polenta"
      version: ">=1.2.3"
      url: "https://gap-packages.github.io/polenta/"

suggested-pkgs:

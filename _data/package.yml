date: 2026-11-10
description: |
    Applications of Lie methods for computations with infinite polycyclic groups

authors:
    - name: Björn Assmann
      url: mailto:bjoern@mcs.st-and.ac.uk

maintainers:
    - name: The GAP Team
      url: mailto:support@gap-system.org

contributors:

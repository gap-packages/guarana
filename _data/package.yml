      version: ">=3.2.0"
      url: "https://gap-packages.github.io/alnuth"
    - name: "fga"
      version: ">=1.0"
      url: "https://gap-packages.github.io/fga/"

www: https://gap-packages.github.io/guarana/
readme: README.md
